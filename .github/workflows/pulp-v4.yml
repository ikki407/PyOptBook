name: PuLP 4 regression tests

on:
  push:
    branches: [v4.0, codex/v4.0-notebooks]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
        pulp: ['3.3.2', '4.0.0']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            6.api/requirements.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - if: matrix.pulp == '3.3.2'
        run: |
          python -m pip install pulp==3.3.2
          git show 3f5c7f7cf1ac7a3793dfc7c47bb90f38d091f347:6.api/problem.py > 6.api/problem.py
          python -m pytest -q -o filterwarnings=default tests/test_api.py
      - if: matrix.pulp == '4.0.0'
        run: python -m pytest -q
