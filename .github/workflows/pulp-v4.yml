name: PuLP 4 regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  api:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
        pulp: ['3.3.2', '4.0.0']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            6.api/requirements.txt
            requirements-test.txt
      - name: Install CBC on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install cbc
          echo "PYOPTBOOK_CBC_PATH=$(brew --prefix cbc)/bin/cbc" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements-test.txt
      - if: matrix.pulp == '3.3.2'
        run: |
          python -m pip install pulp==3.3.2
          git show origin/v3.0:6.api/problem.py > 6.api/problem.py
          python -m pytest -q -o filterwarnings=default tests/test_api.py
      - if: matrix.pulp == '4.0.0'
        run: python -m pytest -q
