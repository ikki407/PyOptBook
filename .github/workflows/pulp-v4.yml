name: PuLP 4 regression tests

on:
  push:
    branches: [v4.0, codex/v4.0-notebooks, codex/v4.0-uv]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.12', '3.13']
        installer: [uv, pip]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.7'
          enable-cache: true
      - run: uv lock --check
      - run: python scripts/export_requirements.py --check
      - if: matrix.installer == 'uv'
        run: |
          uv sync --locked --python ${{ matrix.python }}
          uv run --locked --python ${{ matrix.python }} pytest -q
      - if: matrix.installer == 'pip'
        run: |
          python -m pip install -r requirements-test.txt
          python -m pytest -q

  legacy-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-test.txt
          python -m pip install pulp==3.3.2
          git show 3f5c7f7cf1ac7a3793dfc7c47bb90f38d091f347:6.api/problem.py > 6.api/problem.py
          python -m pytest -q -o filterwarnings=default tests/test_api.py

  alternatives:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.7'
          enable-cache: true
      - run: uv sync --locked --group alternatives
      - run: uv run --locked --group alternatives python -c "import cvxopt, cvxpy, mip, scipy"
