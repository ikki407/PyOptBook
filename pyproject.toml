[project]
name = "pyoptbook"
version = "0.1.0"
description = "Pythonではじめる数理最適化のサンプルコード"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.2.6",
    "pandas>=2.2,<3",
    "pulp[cbc]==4.0.0",
]

[dependency-groups]
api = [
    "flask>=3,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "streamlit>=1.27,<2",
    "lxml>=5,<7",
]
notebooks = [
    "jupyter>=1,<2",
    "ipython>=8,<10",
    "notebook>=7,<8",
    "cvxopt>=1.3.2,<2",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "scipy>=1.14,<2",
    "requests>=2.32,<3",
]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "nbformat>=5.10,<6",
]
alternatives = [
    "mip>=1.15,<2",
    "cvxpy>=1.6,<2",
]

[tool.uv]
package = false
required-version = ">=0.9.7"
default-groups = ["api", "notebooks", "dev"]
